name: Sync Skill Manifests

on:
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "scripts/build_all.py"
  pull_request:
    branches:
      - main
    paths:
      - "skills/**"
      - "scripts/build_all.py"

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate all skills
        run: |
          for dir in skills/*/; do
            python3 skills/skill_creator/scripts/quick_validate.py "$dir"
          done

      - name: Rebuild manifests and catalog
        run: python3 scripts/build_all.py

      - name: Commit updated manifests on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog.json skills/*/manifest.json
            git commit -m "chore: update skill manifests and catalog"
            git push
          fi
