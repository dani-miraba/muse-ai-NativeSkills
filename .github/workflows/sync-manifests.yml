name: Sync Skill Manifests

on:
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "scripts/build_all.py"
  pull_request:
    branches:
      - main
    paths:
      - "skills/**"
      - "scripts/build_all.py"

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild manifests and catalog
        run: python3 scripts/build_all.py

      - name: Require committed manifests and catalog
        run: git diff --exit-code -- catalog.json skills/*/manifest.json

      - name: Verify published installations
        run: python3 scripts/verify_manifests.py

      - name: Validate all skills
        run: |
          for dir in skills/*/; do
            python3 skills/skill_creator/scripts/quick_validate.py "$dir"
          done
